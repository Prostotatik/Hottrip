name: Hottrip
options:
  bundleIdPrefix: uz.hottrip
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HottripUI:
    path: .
targets:
  Hottrip:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: HottripUI
        product: HottripUI
    info:
      path: App/Info.plist   # генерируется XcodeGen из properties ниже — правьте здесь, а не plist
      properties:
        CFBundleDevelopmentRegion: ru
        CFBundleDisplayName: Hottrip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground   # = HTColor.night900, без белой вспышки перед главной
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        UIStatusBarStyle: UIStatusBarStyleLightContent   # только экран запуска (тёмная главная); дальше тон задают экраны
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.hottrip.demo
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  HottripUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HottripUITests
    dependencies:
      - target: Hottrip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.hottrip.demo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Hottrip
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  Hottrip:
    build:
      targets:
        Hottrip: all
        HottripUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HottripUITests
